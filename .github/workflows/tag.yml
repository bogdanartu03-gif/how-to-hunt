# Метка версии (v4.11.0 и т.д.) для зеркала обновлений jsDelivr: игра скачивает exe и по ссылке
# cdn.jsdelivr.net/gh/bogdanartu03-gif/how-to-hunt@vВЕРСИЯ/..., если GitHub не открывается.
name: Version tag
on:
  push:
    branches: [main]
    paths: ["version.json"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag
        run: |
          V=$(python3 -c "import json;print(json.load(open('version.json'))['version'])")
          git tag -f "v$V"
          git push -f origin "v$V"
          echo "::notice::tag v$V"
