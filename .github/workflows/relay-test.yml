name: Relay test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          U=$(grep -oE 'wss://[^"]+' relay.json)
          H=$(echo "$U" | sed 's#^wss://#https://#')
          echo "::notice::health: $(curl -sS -m 20 $H/health 2>&1 | head -c 200)"
          echo "::notice::upgrade: $(curl -sS -m 10 -i -H 'Upgrade: websocket' -H 'Connection: Upgrade' -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' $H/room/ABCDEF?role=host 2>&1 | head -c 300 | tr '\r\n' '  ')"
          for u in $(python3 -c "import json;d=json.load(open('version.json'));print(d['exe_zip'], d.get('exe_mirror',''))"); do
            echo "::notice::download $u -> $(curl -sSL -o /dev/null -w '%{http_code} %{size_download}' --max-time 120 $u 2>&1)"
          done
          node relay/selftest.mjs "$U" 5 2>&1 | tee t.txt
          while IFS= read -r l; do echo "::notice::$l"; done < t.txt
