name: Relay test
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: |
          U=$(grep -oE 'wss://[^"]+' relay.json)
          node relay/selftest.mjs "$U" 200 2>&1 | tee t.txt
          while IFS= read -r l; do echo "::notice::$l"; done < t.txt
