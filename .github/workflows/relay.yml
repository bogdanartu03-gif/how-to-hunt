# Выкладка сервера-посредника для игры по сети (Cloudflare Workers, бесплатно).
# Нужны секреты репозитория: CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID.
# После выкладки адрес сервера записывается в relay.json - игра читает его сама.
name: Relay server
on:
  push:
    paths: ["relay/**", ".github/workflows/relay.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: relay
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Нет секрета CLOUDFLARE_API_TOKEN или CLOUDFLARE_ACCOUNT_ID"; exit 1
          fi
          # Account ID - 32 знака; частая ошибка - лишние пробелы или вставлен не тот номер
          ID=$(echo -n "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          echo "::notice::Account ID: длина ${#ID}"
          export CLOUDFLARE_ACCOUNT_ID="$ID"
          export CLOUDFLARE_API_TOKEN=$(echo -n "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          T="$CLOUDFLARE_API_TOKEN"
          echo "::notice::Токен: длина ${#T}"
          case "$T" in *curl*|*Bearer*|*Authorization*|*http*) echo "::error::В секрет CLOUDFLARE_API_TOKEN вставлена команда/ссылка, а нужен только сам токен";; esac
          case "$T" in *[!A-Za-z0-9_-]*) echo "::error::В токене есть лишние символы (кавычки, пробелы и т.п.) - нужен только сам токен";; esac
          set +e
          npx --yes wrangler@4 whoami > who.txt 2>&1
          sed -e 's/\x1b\[[0-9;]*m//g' who.txt | grep -vE "^\s*$" | tail -12 | while IFS= read -r l; do echo "::notice::whoami: $l"; done
          npx --yes wrangler@4 deploy > out.txt 2>&1
          rc=$?
          set -e
          cat out.txt
          sed -e 's/\x1b\[[0-9;]*m//g' out.txt | grep -vE "^\s*$" | tail -25 | while IFS= read -r l; do
            if [ $rc -ne 0 ]; then echo "::error::$l"; else echo "::notice::$l"; fi
          done
          [ $rc -eq 0 ] || exit 1
          U=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' out.txt | head -1)
          if [ -z "$U" ]; then echo "::error::Адрес *.workers.dev не найден (включите поддомен workers.dev в Cloudflare)"; exit 1; fi
          echo "U=$U" >> $GITHUB_ENV
      - name: Save address for the game
        run: |
          W=$(echo "$U" | sed 's#^https://#wss://#')
          echo "{\"url\": \"$W\"}" > relay.json
          sleep 5
          curl -fsS "$U/health" || echo "::warning::Сервер ещё не ответил (новый поддомен включается до нескольких минут)"
          echo "::notice::Адрес сервера: $W"
          git config user.name "relay-bot"
          git config user.email "relay-bot@users.noreply.github.com"
          git add relay.json
          git commit -m "Адрес сервера для игры по сети [skip ci]" || true
          git pull --rebase -q || true
          git push
